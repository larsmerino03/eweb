<!DOCTYPE html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playlist</title>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="playlist-page">
    <div class="playlist-container">
      <!-- COVER -->
      <div class="playlist-cover">
        <img src="assets/images/playlist_cover.jpg" alt="Chillo Mix Cover" />
      </div>

      <!-- INFO -->
      <div class="playlist-info">
        <h1 class="playlist-title">CHILLO MIX</h1>

        <p class="playlist-description">
          Mein entspannter Mix für Gravel Rides, Gym Sessions oder chillige
          Abende. Eine Mischung aus Indie, Pop und entspannten Beats.
        </p>

        <a
          class="playlist-open-btn"
          href="https://music.apple.com/ch/playlist/chillo-mix/pl.u-KVXBD86sV6JLkq"
          target="_blank"
        >
          ▶ OPEN IN APPLE MUSIC
        </a>
      </div>
    </div>

    <!-- SONG LIST -->
    <div class="playlist-songs">
      <div class="playlist-song">Counting Stars – OneRepublic</div>

      <div class="playlist-song">A Sky Full of Stars – Coldplay</div>

      <div class="playlist-song">Stolen Dance – Milky Chance</div>

      <div class="playlist-song">Sunset Lover – Petit Biscuit</div>

      <div class="playlist-song">Waves – Mr. Probz</div>
    </div>
  </body>
</html>
